<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panther Admin PRO</title><link rel="stylesheet" href="style.css"><main><header><h1>Panther Admin PRO</h1><a href="index.html">Ver tienda</a></header><p id="status" role="status"></p><form id="login"><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" placeholder="Contraseña" required><button>Entrar</button></form><section id="mfa" hidden><div id="qr"></div><input id="code" placeholder="Código de autenticador" inputmode="numeric"><button id="verify">Verificar</button></section><section id="panel" hidden><button id="logout">Cerrar sesión</button><button id="backup">Exportar catálogo</button><button id="maintenance">Cambiar mantenimiento</button><p id="stats"></p><form id="upload"><h2>Publicar o actualizar</h2><input name="name" placeholder="Nombre" required><input name="version" placeholder="Versión" required><input name="bundle" placeholder="Bundle ID" required><input name="category" placeholder="Categoría"><textarea name="description" placeholder="Descripción"></textarea><label>IPA firmada<input name="ipa" type="file" accept=".ipa" required></label><label>Icono PNG<input name="icon" type="file" accept="image/png"></label><label><input name="featured" type="checkbox"> Destacada</label><label><input name="private" type="checkbox"> Privada (archivo no público)</label><progress id="progress" max="3" value="0"></progress><button>Guardar</button></form><section id="list"></section><h2>Historial</h2><section id="history"></section></section></main><script type="module" src="admin.js"></script></html>
