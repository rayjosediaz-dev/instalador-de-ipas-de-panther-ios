<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panther Admin PRO</title><link rel="stylesheet" href="style.css"><style>
body{--accent:#e879bd;--rgb:232,121,189;--wall:url('wallhaven-3qgkev.jpg');background:#080810;isolation:isolate}body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--wall);background-position:center;background-repeat:no-repeat}body:before{z-index:-3;background-size:cover;filter:blur(24px) brightness(.35)}body:after{z-index:-2;background-size:contain;animation:adminWall 14s ease-in-out infinite alternate}main{position:relative;max-width:1200px;width:100%;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}header,article,form,.panel,#mfa{background:#0b0b15df;border:1px solid rgba(var(--rgb),.5);border-radius:20px;padding:clamp(14px,3vw,24px)}h1,a{color:var(--accent)}button{background:var(--accent);color:#101018;font-weight:700;min-height:44px;max-width:100%;white-space:normal}input,select,textarea{font-size:16px;border-color:rgba(var(--rgb),.5);min-width:0}input[type=file]{max-width:100%}pre,p,article{overflow-wrap:anywhere}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}#list article{margin:0;min-width:0}#qr img{width:min(240px,100%);height:auto;object-fit:contain;background:white;padding:8px}.theme-picker{position:relative;margin:8px 0}.theme-picker summary{cursor:pointer;color:var(--accent);padding:12px;border:1px solid var(--accent);border-radius:12px;width:max-content;background:#101018}.theme-picker .choices{display:flex;flex-wrap:wrap;gap:6px}.theme-picker img{display:none} .theme-picker button[aria-pressed=true]{outline:2px solid white}@keyframes adminWall{from{transform:scale(.96)}to{transform:scale(1)}}@media(max-width:480px){main{padding:12px}h1{font-size:26px}#upload button{width:100%}#panel>button{margin:4px 2px;padding:10px}header{margin-top:0}}@media(prefers-reduced-motion:reduce){body:after{animation:none}}
</style><main><header><h1>Panther Admin PRO</h1><a href="index.html">Ver tienda</a><details class="theme-picker"><summary>◈ Cambiar tema</summary><div class="choices"><button type="button" data-theme="0"><img src="wallhaven-3qgkev.jpg" alt="">Tema 1</button><button type="button" data-theme="1"><img src="wallhaven-4oy5gl.jpg" alt="">Tema 2</button><button type="button" data-theme="2"><img src="wallhaven-rdr25q.jpg" alt="">Tema 3</button></div></details></header><p id="status" role="status"></p><form id="login" method="post"><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" placeholder="Contraseña" required><button>Entrar</button><small>Tu sesión se conserva en este navegador. Cierra sesión si utilizas un dispositivo compartido.</small></form><section id="mfa" hidden><div id="qr"></div><input id="code" placeholder="Código de autenticador" inputmode="numeric"><button id="verify">Verificar</button></section><section id="panel" hidden><button id="logout">Cerrar sesión</button><button id="backup">Exportar catálogo</button><button id="maintenance">Cambiar mantenimiento</button><p id="stats"></p><details><summary>Panther Studio — Editor visual</summary><form id="studio-form"><label>Nombre de tienda<input name="title" required maxlength="80"></label><label>Duración de animación (segundos)<input name="speed" type="number" min="3" max="60" required></label><label>Temas existentes (nombre, URL y color opcional)<textarea name="themes" rows="9" required></textarea></label><label>Nuevo fondo<input name="wall" type="file" accept="image/png,image/jpeg,image/webp"></label><input name="wallname" placeholder="Nombre del nuevo tema"><label>Color del nuevo tema<input name="color" type="color" value="#e879bd"></label><button type="button" data-preview>Vista previa</button><button>Publicar diseño</button><p id="studio-status" role="status"></p></form></details><form id="upload"><h2>Publicar o actualizar</h2><input name="name" placeholder="Nombre" required><input name="version" placeholder="Versión" required><input name="bundle" placeholder="Bundle ID automático" readonly><input name="category" placeholder="Categoría"><textarea name="description" placeholder="Descripción"></textarea><label>IPA firmada<input name="ipa" type="file" accept=".ipa" required></label><label>Icono PNG (opcional; extracción automática)<input name="icon" type="file" accept="image/png"></label><label><input name="featured" type="checkbox"> Destacada</label><label><input name="private" type="checkbox"> Privada (archivo no público)</label><h3>Informe de integridad</h3><pre id="integrity" style="white-space:pre-wrap;overflow-wrap:anywhere" role="status"></pre><progress id="progress" max="3" value="0"></progress><button>Guardar</button></form><section id="list"></section><h2>Historial</h2><section id="history"></section></section></main><script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();document.getElementById('status').textContent='Cargando sistema de acceso…';});</script><script type="module">import('./admin.js?v=ota10').catch(function(e){document.getElementById('status').textContent='Error al cargar el administrador: '+e.message;});</script><script>
(()=>{const buttons=[...document.querySelectorAll('[data-theme]')];const colors=[[232,121,189],[255,153,70],[120,155,255]];let current=0;try{current=Number(localStorage.getItem('panther-theme'))||0}catch{}function apply(n){if(!buttons[n])n=0;const b=buttons[n],img=b.querySelector('img');document.body.style.setProperty('--wall','url("'+img.getAttribute('src')+'")');document.body.style.setProperty('--rgb',colors[n].join(','));document.body.style.setProperty('--accent','rgb('+colors[n].join(',')+')');buttons.forEach((x,i)=>x.setAttribute('aria-pressed',String(i===n)));try{localStorage.setItem('panther-theme',String(n))}catch{}const sample=new Image();sample.onload=()=>{if(b.getAttribute('aria-pressed')!=='true')return;try{const c=document.createElement('canvas');c.width=c.height=32;const ctx=c.getContext('2d');ctx.drawImage(sample,0,0,32,32);const d=ctx.getImageData(0,0,32,32).data;let sums=[0,0,0],total=0;for(let i=0;i<d.length;i+=4){const p=[d[i],d[i+1],d[i+2]],max=Math.max(...p),min=Math.min(...p),w=(max-min)*max;if(max<65||max-min<25)continue;p.forEach((v,j)=>sums[j]+=v*w);total+=w}if(total){let rgb=sums.map(v=>v/total);const scale=235/Math.max(...rgb);rgb=rgb.map(v=>Math.round(Math.min(255,v*scale*.75+55)));document.body.style.setProperty('--rgb',rgb.join(','));document.body.style.setProperty('--accent','rgb('+rgb.join(',')+')')}}catch{}};sample.src=img.src}buttons.forEach((b,i)=>b.onclick=()=>{apply(i);document.querySelector('.theme-picker').open=false});apply(current)})();
</script><style>body.store::before,body:not(.store)::after{animation-duration:var(--studio-speed,14s)}@media(prefers-reduced-motion:reduce){body.store::before,body:not(.store)::after{animation:none}}</style><script type="module" src="studio.js"></script></html>
